name: Bug report
description: Report a problem with GameNative x64 on an x86_64 Android PC or tablet
title: "[Bug]: "
labels: bug
assignees: []
body:

  - type: markdown
    attributes:
      value: |
        Thanks for reporting. GameNative x64 runs on x86_64 Android devices (Bliss OS, Bass OS, Android desktops such as Googlebooks).
        For ARM phones and handhelds, report to upstream GameNative instead.

        - The quickest way to file a report is from the app: run the game with **Debug run** (game menu), quit it, then choose **Report on GitHub**. Most fields below are filled in for you, and the app offers the log to attach.
        - Please attach the log. Reports without one are much harder to act on.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      placeholder: "Name and store, e.g. Warhammer 40,000: Boltgun (Steam)"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: How do you get from the GameNative library to the problem?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Graphics or black screen
        - Mouse, keyboard or controller
        - Sound
        - Game will not start or crashes
        - Downloads, stores or cloud saves
        - Linux apps
        - Something else
    validations:
      required: true

  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - Intel
        - AMD
        - NVIDIA
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: presentation
    attributes:
      label: Frame presentation (Settings > Performance)
      options:
        - Automatic
        - Direct (DRI3)
        - Shared memory
        - Software copy
        - Not sure

  - type: input
    id: gnx64-version
    attributes:
      label: GameNative x64 version
      description: Settings > Info, or filled in by the app
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. Acer Googlebook 14, Android 17 / AIxBoard, Bliss OS 17"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the log files from the app's Report on GitHub share, or a logcat, into this box.

  - type: textarea
    id: details
    attributes:
      label: Anything else
