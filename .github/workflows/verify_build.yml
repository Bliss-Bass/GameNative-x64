name: Verify Build

on:
  push:
    branches: [ "bliss-x64" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'media/**'
  pull_request:
    branches: [ "bliss-x64" ]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold cache builds Mesa in a container after pulling a ~700MB NDK.
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Prepare Gradle inputs
      uses: ./.github/actions/gradle-prepare
      with:
        posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
        posthog-host: ${{ secrets.POSTHOG_HOST }}
        steamgriddb-api-key: ${{ secrets.STEAMGRIDDB_API_KEY }}

    - name: Build x64 Vulkan payload
      uses: ./.github/actions/x64-payload

    - name: Build with Gradle
      run: ./gradlew :app:assembleModernX64Debug

    - name: Run Unit Tests
      run: ./gradlew :app:testModernX64DebugUnitTest
