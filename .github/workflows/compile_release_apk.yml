name: Compile Release APK

on:
  workflow_dispatch:
    inputs:
      force_payload_rebuild:
        description: 'Rebuild the Vulkan payload even if the cache hits'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode signing keystore
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: bash .github/scripts/decode-signing-keystore.sh app/keystores/release.keystore

    - name: Build x64 Vulkan payload
      uses: ./.github/actions/x64-payload
      with:
        force-rebuild: ${{ inputs.force_payload_rebuild || false }}

    # -PnoMinify=true: a minified release ANRs within ~10s of launch, spinning in a
    # Compose recomposition loop rather than deadlocking. Drop it once R8 keep rules for
    # Compose are sorted out.
    - name: Build signed Release APK
      env:
        RELEASE_STORE_FILE: app/keystores/release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew :app:assembleModernX64Release -PnoMinify=true

    - name: Verify release APK signature
      run: |
        APK=app/build/outputs/apk/modernX64/release/app-modernX64-release.apk
        jarsigner -verify -verbose -certs "$APK" | tail -20
        # Guard against the debug fallback silently shipping: that key differs per runner,
        # so published APKs could not upgrade one another.
        if jarsigner -verify -verbose -certs "$APK" | grep -qi "CN=Android Debug"; then
          echo "::error::APK is debug-signed; check the SIGNING_* secrets"
          exit 1
        fi

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: GameNative-x64-Release
        path: app/build/outputs/apk/modernX64/release/*.apk
        if-no-files-found: error

    - name: Remove signing keystore
      if: always()
      run: rm -f app/keystores/release.keystore app/keystores/keystore.properties
