name: Issue triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Issue forms render each field as "### Label" followed by the answer.
            const field = (label) => {
              const match = body.match(new RegExp(`### ${label}\\s*\\n+([^#]*)`));
              const value = match ? match[1].trim() : '';
              return value === '_No response_' ? '' : value;
            };

            const labels = [];
            const gpu = field('GPU');
            if (/intel/i.test(gpu)) labels.push('gpu: intel');
            if (/amd/i.test(gpu)) labels.push('gpu: amd');
            if (/nvidia/i.test(gpu)) labels.push('gpu: nvidia');

            const areas = {
              'Graphics': 'area: graphics',
              'Mouse': 'area: input',
              'Sound': 'area: audio',
              'Game will not start': 'area: launch',
              'Downloads': 'area: stores',
              'Linux apps': 'area: linux',
            };
            const area = field('Area');
            for (const [prefix, label] of Object.entries(areas)) {
              if (area.startsWith(prefix)) labels.push(label);
            }

            // Attachments land as user-attachments links; pasted logs are long.
            const logs = field('Logs');
            const hasLogs = /user-attachments|\.(gz|zip|log|txt)\b/i.test(body) || logs.length > 400;
            if (!hasLogs) labels.push('needs logs');

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels,
              });
            }

            if (hasLogs && issue.labels.some((l) => l.name === 'needs logs')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs logs',
              }).catch(() => {});
            }

            if (context.payload.action === 'opened' && !hasLogs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  'Thanks for the report. There is no log attached yet, which makes this hard to track down.',
                  '',
                  'In GameNative x64: open the game menu, choose **Debug run**, reproduce the problem and quit the game.',
                  'Then choose **Report on GitHub** and attach the log files it offers by dragging them into a comment here.',
                ].join('\n'),
              });
            }
